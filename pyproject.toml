[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biotoxbridge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "rdkit",
    "numpy",
    "scipy",
    "scikit-learn",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires live Redis and external services"
]
